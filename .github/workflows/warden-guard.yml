name: Warden Guard

on:
  pull_request:
  push:
    branches: [main, 'warden-guard-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Synthetic security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Initialize sanitized failure report
        run: python3 evaluation-dataset/ci_guard.py --initialize
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned synthetic test dependencies
        shell: bash
        run: |
          if ! python -m pip install --disable-pip-version-check -r evaluation-dataset/requirements-ci.lock > "$RUNNER_TEMP/warden-dependencies.log" 2>&1; then
            echo "Synthetic test dependency installation failed."
            exit 1
          fi
      - name: Run mandatory security suites
        run: python -B evaluation-dataset/ci_guard.py --run
      - name: Verify counts and publish sanitized job summary
        if: always()
        run: python3 evaluation-dataset/ci_guard.py --verify --github-summary
      - name: Upload sanitized security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: warden-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/security/results.json
            reports/security/summary.md
          if-no-files-found: error
          retention-days: 7
